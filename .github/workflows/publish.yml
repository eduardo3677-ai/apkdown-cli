name: CI, Release & Marketplace Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch, minor, major, none)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  id-token: write
  packages: write
  actions: write

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Compile Package Bundle
        run: npm run build

  release-and-publish:
    name: Auto Version, Release & Publish to NPM and Marketplace
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi
          npm ci || npm install

      - name: Automated Version Bump & Commit
        id: version_bump
        run: |
          CURRENT_LOCAL_VER=$(node -p "require('./package.json').version")
          NPM_REMOTE_VER=$(npm view @eduardo3677-ai/apkdown-cli version 2>/dev/null || echo "0.0.0")

          echo "Current Local Version:  ${CURRENT_LOCAL_VER}"
          echo "Current Remote Version: ${NPM_REMOTE_VER}"

          BUMP_TYPE="${{ github.event.inputs.bump }}"
          
          # If version is already on NPM or manual bump requested, bump to next version
          if [ "$CURRENT_LOCAL_VER" = "$NPM_REMOTE_VER" ] || [ -n "$BUMP_TYPE" -a "$BUMP_TYPE" != "none" ]; then
            TARGET_BUMP="${BUMP_TYPE:-patch}"
            echo "Auto-bumping version with: ${TARGET_BUMP}..."
            npm version "$TARGET_BUMP" --no-git-tag-version
            NEW_VER=$(node -p "require('./package.json').version")
            
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to v${NEW_VER} [skip ci]"
            git push origin main
          fi

          # Pull latest commits to ensure synchronous tree
          git pull origin main --rebase

          FINAL_VERSION=$(node -p "require('./package.json').version")
          MAJOR_VERSION=$(echo "$FINAL_VERSION" | cut -d. -f1)

          echo "version=${FINAL_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${FINAL_VERSION}" >> $GITHUB_OUTPUT
          echo "major_tag=v${MAJOR_VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved release version: v${FINAL_VERSION}"

      - name: Compile Distribution Bundle with New Version
        run: npm run build

      - name: Publish to NPM Registry (@eduardo3677-ai/apkdown-cli)
        run: |
          FINAL_VERSION="${{ steps.version_bump.outputs.version }}"
          NPM_REMOTE_VER=$(npm view @eduardo3677-ai/apkdown-cli version 2>/dev/null || echo "0.0.0")

          if [ "$FINAL_VERSION" != "$NPM_REMOTE_VER" ]; then
            echo "Publishing @eduardo3677-ai/apkdown-cli@${FINAL_VERSION} to NPM..."
            npm publish --access public
          else
            echo "Version ${FINAL_VERSION} already published to NPM."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Tag Git Version and Publish GitHub Marketplace Release
        run: |
          TAG="${{ steps.version_bump.outputs.tag }}"
          MAJOR_TAG="${{ steps.version_bump.outputs.major_tag }}"
          VERSION="${{ steps.version_bump.outputs.version }}"

          echo "Creating Git Tag ${TAG} and updating major tag ${MAJOR_TAG}..."

          # Create or update specific release tag
          git tag -fa "$TAG" -m "Release ${TAG}"
          git push origin "$TAG" --force

          # Update floating major tag (e.g. v1) to point to the latest release
          git tag -fa "$MAJOR_TAG" -m "Update ${MAJOR_TAG} tag to ${TAG}"
          git push origin "$MAJOR_TAG" --force

          # Create or update GitHub Release for Marketplace
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "APKDown ${TAG} - Multi-Source Android APK Downloader & GitHub Action" \
            --generate-notes \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
