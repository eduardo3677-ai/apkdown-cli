name: CI, Release & Marketplace Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch, minor, major) or specific version'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  id-token: write
  packages: write
  actions: write

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Compile Package Bundle
        run: npm run build

  release-and-publish:
    name: Release & Publish to NPM and GitHub Marketplace
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Compile Package Bundle
        run: npm run build

      - name: Handle Version Bump (if requested via dispatch)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.bump != 'none'
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to v${NEW_VERSION}" || true
          git push origin main || true

      - name: Extract Current Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MAJOR_VERSION=$(echo "$VERSION" | cut -d. -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "major_tag=v${MAJOR_VERSION}" >> $GITHUB_OUTPUT

      - name: Publish to NPM Registry (@eduardo3677-ai/apkdown-cli)
        run: |
          # Publish if version is not yet published
          CURRENT_PKG_VER=$(node -p "require('./package.json').version")
          NPM_REMOTE_VER=$(npm view @eduardo3677-ai/apkdown-cli version 2>/dev/null || echo "none")
          
          if [ "$CURRENT_PKG_VER" != "$NPM_REMOTE_VER" ]; then
            echo "Publishing version ${CURRENT_PKG_VER} to NPM..."
            npm publish --access public
          else
            echo "Version ${CURRENT_PKG_VER} is already published to NPM. Skipping publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Create or Update Git Tags and GitHub Release (Marketplace)
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          MAJOR_TAG="${{ steps.get_version.outputs.major_tag }}"
          VERSION="${{ steps.get_version.outputs.version }}"

          echo "Target tag: ${TAG}, Major tag: ${MAJOR_TAG}"

          # Create release tag if not exists
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release ${TAG}"
            git push origin "$TAG"
          fi

          # Update floating major tag (e.g. v1) to point to the latest release
          git tag -fa "$MAJOR_TAG" -m "Update ${MAJOR_TAG} tag to ${TAG}"
          git push origin "$MAJOR_TAG" --force

          # Create or update GitHub Release for Marketplace
          gh release view "$TAG" || gh release create "$TAG" \
            --title "APKDown ${TAG} - Multi-Source Android APK Downloader" \
            --generate-notes \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
