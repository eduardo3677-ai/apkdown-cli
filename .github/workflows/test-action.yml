name: Test APKDown GitHub Action

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  test-scenarios:
    name: Test Action Across Scenarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Scenario 1: Multi-Provider Automatic Comparison to Root Workspace
      - name: "Scenario 1: Auto Cross-Provider Download (Root Workspace)"
        id: test_auto
        uses: eduardo3677-ai/apkdown-cli@latest
        with:
          id: "org.videolan.vlc"
          provider: "all"
          arch: "auto"
          output-dir: "./"

      - name: "Validate Scenario 1 Outputs"
        run: |
          echo "Scenario 1 File Path: ${{ steps.test_auto.outputs.file-path }}"
          echo "Scenario 1 File Name: ${{ steps.test_auto.outputs.file-name }}"
          echo "Scenario 1 Version:   ${{ steps.test_auto.outputs.version }}"
          echo "Scenario 1 Provider:  ${{ steps.test_auto.outputs.provider }}"
          echo "Scenario 1 SHA-256:   ${{ steps.test_auto.outputs.sha256 }}"

          # Verify file exists on runner
          test -f "${{ steps.test_auto.outputs.file-path }}"
          echo "✔ Scenario 1 Binary verified on filesystem!"

      # Scenario 2: Specific Provider (F-Droid) with Architecture & Custom Filename
      - name: "Scenario 2: Specific Provider (FDroid) + Custom Filename"
        id: test_fdroid
        uses: eduardo3677-ai/apkdown-cli@latest
        with:
          id: "org.fdroid.fdroid"
          provider: "fdroid"
          arch: "arm64-v8a"
          filename: "fdroid-arm64-official.apk"
          output-dir: "./"

      - name: "Validate Scenario 2 Outputs"
        run: |
          test -f "fdroid-arm64-official.apk"
          echo "✔ Scenario 2 Custom filename verified: ${{ steps.test_fdroid.outputs.file-path }}"

      # Scenario 3: Provider Exclusion + Channel Filtering
      - name: "Scenario 3: Provider Exclusion (-x appgallery,aptoide) + Stable Channel"
        id: test_exclusion
        uses: eduardo3677-ai/apkdown-cli@latest
        with:
          id: "org.schabi.newpipe"
          exclude-provider: "appgallery,aptoide"
          arch: "universal"
          channel: "stable"
          output-dir: "./"

      - name: "Validate Scenario 3 Outputs"
        run: |
          test -f "${{ steps.test_exclusion.outputs.file-path }}"
          echo "✔ Scenario 3 Output verified from provider: ${{ steps.test_exclusion.outputs.provider }}"

      # Scenario 4: GitHub Releases Source + Custom Directory
      - name: "Scenario 4: GitHub Releases Source + Custom Subdirectory"
        id: test_github
        uses: eduardo3677-ai/apkdown-cli@latest
        with:
          id: "libre-tube/LibreTube"
          provider: "github"
          arch: "arm64-v8a"
          output-dir: "./downloaded_artifacts"

      - name: "Validate Scenario 4 Outputs"
        run: |
          test -f "${{ steps.test_github.outputs.file-path }}"
          ls -la ./downloaded_artifacts
          echo "✔ Scenario 4 Output in custom directory verified!"

      # Scenario 5: Upload Downloaded APKs as GitHub Artifact Bundle
      - name: "Scenario 5: Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: test-apk-bundle
          path: |
            *.apk
            *.xapk
            ./downloaded_artifacts/*
          retention-days: 7
